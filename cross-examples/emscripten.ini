# Meson cross file for WebAssembly via Emscripten.
# Used by wasm/build.sh; requires emsdk's environment (emsdk_env.sh) so that emcc etc. are on PATH,
# and PKG_CONFIG_LIBDIR pointing at the sysroot made by wasm/build-deps.sh.

[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
ranlib = 'emranlib'
strip = 'emstrip'
pkg-config = 'pkg-config'

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'
